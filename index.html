  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    :root {
      --c1: 330;
      --c2: 12;
      --glow: 42;
      --speed: 18s;
      --rose: hsl(var(--c1) 72% 62%);
      --gold: hsl(var(--glow) 82% 68%);
      --ink: #2a1220;
      --paper: rgba(255, 248, 246, 0.86);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      background: #1a0612;
    }
    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(1200px 700px at 12% 8%, hsl(var(--c1) 80% 42% / 0.55), transparent 55%),
        radial-gradient(900px 600px at 88% 18%, hsl(var(--c2) 85% 38% / 0.5), transparent 50%),
        radial-gradient(800px 500px at 50% 100%, hsl(var(--glow) 70% 28% / 0.45), transparent 55%),
        linear-gradient(160deg, #2a0b1c 0%, #4a1230 40%, #1d0a18 100%);
      animation: hueShift var(--speed) linear infinite;
    }
    @keyframes hueShift {
      0% { filter: hue-rotate(0deg) saturate(1.05); }
      50% { filter: hue-rotate(18deg) saturate(1.2); }
      100% { filter: hue-rotate(0deg) saturate(1.05); }
    }
    canvas#spark {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .veil {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 80%, rgba(255, 210, 180, 0.08), transparent 40%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 3px);
    }
    .wrap {
      position: relative;
      z-index: 3;
      max-width: 1080px;
      margin: 0 auto;

    }
    header.hero {
      text-align: center;
      padding: 48px 28px 36px;

      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 230, 210, 0.35);
      box-shadow: 0 30px 80px rgba(80, 10, 40, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
      overflow: hidden;
    }
    header.hero::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -80px;
      width: 280px;
      height: 280px;
      transform: translateX(-50%);
      background: radial-gradient(circle, hsl(var(--glow) 90% 70% / 0.55), transparent 70%);
      pointer-events: none;
    }
    .stamp {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      color: #fff8f0;
      background: linear-gradient(90deg, rgba(120, 20, 50, 0.55), rgba(180, 80, 40, 0.45));
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 220, 170, 0.45);
    }
    h1.title {
      font-family: "Great Vibes", cursive;
      font-size: clamp(52px, 9vw, 92px);
      font-weight: 400;
      color: #fff7ec;
      text-shadow: 0 8px 30px rgba(80, 10, 30, 0.45);
      margin: 18px 0 6px;
      position: relative;
    }
    .subtitle {

      font-size: clamp(18px, 2.4vw, 26px);
      font-style: italic;
      color: #ffe8d2;
      margin-bottom: 22px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .chip {
      background: rgba(255, 248, 244, 0.88);
      color: #5a2038;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 200, 170, 0.7);
    }
    .letter {
      margin-top: 28px;
      background: var(--paper);
      border-radius: 24px;
      padding: 34px 32px;
      box-shadow: 0 24px 60px rgba(40, 8, 20, 0.28);
      border: 1px solid rgba(255, 220, 200, 0.7);

    .greet {

      color: #3b1a28;
